<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Плейсхолдер: два партнёра в чёрном, тёмные очки, спокойная поза">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15161c"/>
      <stop offset="0.55" stop-color="#0c0d11"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#2a2c37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2a2c37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141519"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3b45"/>
      <stop offset="1" stop-color="#26262e"/>
    </linearGradient>
  </defs>

  <!-- фон + пятно света -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#spot)"/>
  <!-- линия пола -->
  <rect x="0" y="930" width="1600" height="70" fill="#000" opacity="0.55"/>

  <!-- ЛЕВЫЙ партнёр -->
  <g>
    <!-- корпус: пиджак, широкие плечи -->
    <path d="M540 1000 C540 780 560 660 600 610 C640 560 720 545 760 545 C800 545 880 560 920 610 C960 660 980 780 980 1000 Z" fill="url(#cloth)"/>
    <!-- лацканы / рубашка -->
    <path d="M760 560 L720 720 L760 780 L800 720 Z" fill="#0b0c10"/>
    <path d="M760 575 L742 705 L760 745 L778 705 Z" fill="#e9e9ee" opacity="0.9"/>
    <path d="M760 620 l10 18 l-10 18 l-10 -18 Z" fill="#0b0c10"/>
    <!-- шея + голова -->
    <rect x="738" y="500" width="44" height="70" rx="18" fill="url(#skin)"/>
    <circle cx="760" cy="450" r="86" fill="url(#skin)"/>
    <!-- волосы -->
    <path d="M676 452 C676 388 716 356 760 356 C804 356 844 388 844 452 C844 430 812 404 760 404 C708 404 676 430 676 452 Z" fill="#0a0a0d"/>
    <!-- тёмные очки -->
    <g fill="#050506" stroke="#000" stroke-width="2">
      <rect x="704" y="440" width="46" height="30" rx="9"/>
      <rect x="770" y="440" width="46" height="30" rx="9"/>
      <rect x="750" y="450" width="20" height="7"/>
    </g>
    <line x1="704" y1="452" x2="682" y2="446" stroke="#050506" stroke-width="6" stroke-linecap="round"/>
    <line x1="816" y1="452" x2="838" y2="446" stroke="#050506" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ПРАВЫЙ партнёр -->
  <g>
    <path d="M660 1000 C660 800 686 700 726 655 C760 617 812 604 848 604 C884 604 936 617 970 655 C1010 700 1040 800 1050 1000 Z" fill="url(#cloth)" transform="translate(160,0)"/>
    <!-- корпус (второй) -->
    <path d="M820 1000 C820 800 846 700 886 655 C920 617 972 604 1008 604 C1044 604 1096 617 1130 655 C1170 700 1196 800 1206 1000 Z" fill="url(#cloth)"/>
    <path d="M1008 618 L972 760 L1008 815 L1044 760 Z" fill="#0b0c10"/>
    <path d="M1008 632 L992 748 L1008 786 L1024 748 Z" fill="#e9e9ee" opacity="0.9"/>
    <path d="M1008 672 l9 16 l-9 16 l-9 -16 Z" fill="#0b0c10"/>
    <rect x="988" y="560" width="42" height="66" rx="17" fill="url(#skin)"/>
    <circle cx="1008" cy="512" r="82" fill="url(#skin)"/>
    <path d="M928 514 C928 452 966 422 1008 422 C1050 422 1088 452 1088 514 C1088 492 1058 468 1008 468 C958 468 928 492 928 514 Z" fill="#0a0a0d"/>
    <g fill="#050506" stroke="#000" stroke-width="2">
      <rect x="954" y="502" width="44" height="29" rx="9"/>
      <rect x="1018" y="502" width="44" height="29" rx="9"/>
      <rect x="998" y="512" width="20" height="7"/>
    </g>
    <line x1="954" y1="514" x2="933" y2="508" stroke="#050506" stroke-width="6" stroke-linecap="round"/>
    <line x1="1062" y1="514" x2="1083" y2="508" stroke="#050506" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- виньетка -->
  <rect width="1600" height="1000" fill="url(#spot)" opacity="0"/>
  <rect width="1600" height="1000" fill="#000" opacity="0" />
  <rect x="0" y="0" width="1600" height="1000" fill="none"/>
  <rect x="0" y="0" width="1600" height="1000" style="fill:none"/>

  <!-- watermark: явная пометка что это плейсхолдер -->
  <text x="800" y="70" text-anchor="middle" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="26" letter-spacing="6" fill="#6b6c78">PLACEHOLDER · ФОТО ПАРТНЁРОВ</text>
</svg>
