<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Страница не найдена — БАЗА</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308080a'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='900' fill='%23f5f5f7' text-anchor='middle'%3E%D0%91%3C/text%3E%3C/svg%3E" />
  <!-- GitHub Pages отдаёт эту страницу на любом неверном адресе — поэтому все пути абсолютные -->
  <link rel="stylesheet" href="/css/webfonts.css?v=1" />
  <link rel="stylesheet" href="/css/fonts.css?v=2" />
  <style>
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; }
    body{
      min-height:100vh; min-height:100dvh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 16px; text-align:center; color:#161512;
      font-family:'Onest',-apple-system,BlinkMacSystemFont,Arial,sans-serif;
      background:#f4efe6 url('/assets/fon-baza.jpg') center / cover no-repeat fixed;
      background:#f4efe6 image-set(url('/assets/fon-baza.webp') type('image/webp'), url('/assets/fon-baza.jpg') type('image/jpeg')) center / cover no-repeat fixed;
    }
    body::before{ content:""; position:fixed; inset:0; z-index:-1; background:rgba(245,240,232,.62); }
    .logo{ height:64px; margin-bottom:28px; }
    .code{ margin:0; font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:clamp(96px,22vw,180px); line-height:1; color:#c0392b; }
    h1{ margin:14px 0 10px; font-family:'Geist',-apple-system,Arial,sans-serif; font-weight:800; font-size:clamp(24px,4vw,34px); letter-spacing:-.02em; }
    p{ margin:0 auto; max-width:460px; color:#4a463f; line-height:1.55; }
    .actions{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:30px; }
    .btn{
      display:inline-flex; align-items:center; min-height:48px; padding:0 24px; border-radius:999px;
      font-family:'Geist',-apple-system,Arial,sans-serif; font-weight:600; font-size:16px; text-decoration:none;
      border:1px solid rgba(30,26,20,.18); color:#161512; background:rgba(255,255,255,.7);
    }
    .btn--main{ background:#161512; color:#fff; border-color:#161512; }
    .btn:focus-visible{ outline:2px solid #8b93ff; outline-offset:3px; }
  </style>
</head>
<body>
  <a href="/" aria-label="БАЗА — на главную"><img class="logo" src="/assets/logo-baza-black.svg" alt="БАЗА" /></a>
  <p class="code" aria-hidden="true">404</p>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Всё главное о БАЗЕ — на главной странице.</p>
  <div class="actions">
    <a class="btn btn--main" href="/">На главную</a>
    <a class="btn" href="/#block6">Оставить заявку</a>
  </div>
</body>
</html>
